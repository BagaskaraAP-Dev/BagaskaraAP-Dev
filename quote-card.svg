<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Core Philosophy - Bagaskara Amukti Palapa">

  <defs>
    <!-- Pixel Grid Pattern -->
    <pattern id="pixelGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#13141f"/>
      <rect x="0" y="0" width="15" height="15" fill="#181926"/>
      <rect x="0" y="0" width="1" height="1" fill="#24283b" opacity="0.6"/>
    </pattern>

    <!-- Flame Animation Styles: Pure blazing heat without side-to-side wobble & NO blinking cursor -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=JetBrains+Mono:wght@500;700;800&amp;display=swap');

      .pixel-font {
        font-family: 'Press Start 2P', monospace;
      }

      .mono-font {
        font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
      }

      .core-statement {
        font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'SF Mono', Consolas, monospace;
        letter-spacing: 0.5px;
      }

      /* Fire Core Upward Blazing Animation (Vertical heat only) */
      @keyframes blazeMain {
        0%, 100% { transform: scaleY(1); opacity: 0.98; }
        25% { transform: scaleY(1.14); opacity: 1; }
        50% { transform: scaleY(0.96); opacity: 0.93; }
        75% { transform: scaleY(1.20); opacity: 1; }
      }

      @keyframes blazeLeftTongue {
        0%, 100% { transform: scaleY(0.94); opacity: 0.88; }
        35% { transform: scaleY(1.22); opacity: 1; }
        70% { transform: scaleY(0.85); opacity: 0.82; }
      }

      @keyframes blazeRightTongue {
        0%, 100% { transform: scaleY(1.05); opacity: 0.9; }
        45% { transform: scaleY(1.25); opacity: 1; }
        80% { transform: scaleY(0.90); opacity: 0.85; }
      }

      @keyframes blazeCoreHeat {
        0%, 100% { transform: scaleY(1); opacity: 1; }
        30% { transform: scaleY(1.18); opacity: 0.95; }
        65% { transform: scaleY(0.92); opacity: 1; }
      }

      /* Rising Ember Particles */
      @keyframes emberFly1 {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-65px); opacity: 0; }
      }

      @keyframes emberFly2 {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-75px); opacity: 0; }
      }

      @keyframes emberFly3 {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-55px); opacity: 0; }
      }

      @keyframes emberFly4 {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-80px); opacity: 0; }
      }

      @keyframes fireHeatGlow {
        0%, 100% { filter: drop-shadow(0 -4px 10px rgba(255, 85, 0, 0.6)); }
        50% { filter: drop-shadow(0 -8px 24px rgba(255, 140, 0, 0.9)); }
      }

      .fire-blaze-main {
        transform-origin: 0px 40px;
        animation: blazeMain 0.65s ease-in-out infinite;
      }

      .fire-left-tongue {
        transform-origin: -16px 40px;
        animation: blazeLeftTongue 0.55s ease-in-out infinite;
      }

      .fire-right-tongue {
        transform-origin: 16px 40px;
        animation: blazeRightTongue 0.6s ease-in-out infinite 0.15s;
      }

      .fire-core-white {
        transform-origin: 0px 30px;
        animation: blazeCoreHeat 0.45s ease-in-out infinite;
      }

      .fire-glow-wrap {
        animation: fireHeatGlow 1.5s ease-in-out infinite;
      }

      .ember-p1 { animation: emberFly1 1.1s ease-out infinite; }
      .ember-p2 { animation: emberFly2 1.5s ease-out infinite 0.3s; }
      .ember-p3 { animation: emberFly3 1.3s ease-out infinite 0.6s; }
      .ember-p4 { animation: emberFly4 1.7s ease-out infinite 0.9s; }
    </style>

    <!-- Linear Accent for Borders -->
    <linearGradient id="fireGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff1a1a"/>
      <stop offset="40%" stop-color="#ff6600"/>
      <stop offset="80%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Base Background -->
  <rect width="900" height="320" fill="url(#pixelGrid)" rx="6"/>

  <!-- Pixelated Stepped Border Corners -->
  <rect x="4" y="4" width="892" height="312" fill="none" stroke="#2a2e45" stroke-width="2"/>
  <rect x="8" y="8" width="884" height="304" fill="none" stroke="#ff5500" stroke-width="2" opacity="0.5"/>

  <!-- Pixel Corner Blocks -->
  <g fill="#ff5500">
    <rect x="4" y="4" width="12" height="4"/>
    <rect x="4" y="8" width="4" height="8"/>
    <rect x="884" y="4" width="12" height="4"/>
    <rect x="892" y="8" width="4" height="8"/>
    <rect x="4" y="312" width="12" height="4"/>
    <rect x="4" y="304" width="4" height="8"/>
    <rect x="884" y="312" width="12" height="4"/>
    <rect x="892" y="304" width="4" height="8"/>
  </g>

  <!-- Window Header Bar (Pixel Style) -->
  <rect x="12" y="12" width="876" height="32" fill="#1f2335"/>
  <rect x="12" y="44" width="876" height="2" fill="#ff5500" opacity="0.8"/>

  <!-- Window Buttons -->
  <rect x="24" y="22" width="12" height="12" fill="#f7768e"/>
  <rect x="44" y="22" width="12" height="12" fill="#e0af68"/>
  <rect x="64" y="22" width="12" height="12" fill="#9ece6a"/>

  <!-- Status indicator -->
  <g transform="translate(730, 20)">
    <rect x="0" y="0" width="140" height="16" fill="#13141f" stroke="#33384d" stroke-width="1"/>
    <rect x="6" y="5" width="6" height="6" fill="#9ece6a"/>
    <text x="18" y="12" class="pixel-font" font-size="8" fill="#9ece6a">FIRE STREAK: ON</text>
  </g>

  <!-- Left Accent Decorative Line -->
  <rect x="24" y="60" width="4" height="210" fill="url(#fireGrad)"/>

  <!-- Core Content Quotation (Clean without any blinking cursor) -->
  <g transform="translate(48, 65)">
    <text x="0" y="24" class="pixel-font" font-size="11" fill="#ff9e3b" letter-spacing="2">&gt; CORE_MINDSET</text>

    <g class="core-statement" font-size="21" font-weight="700">
      <text x="0" y="68" fill="#a9b1d6">BUILD IT LIKE AN <tspan fill="#9ece6a">ENGINEER.</tspan></text>
      <text x="0" y="108" fill="#a9b1d6">THINK LIKE AN <tspan fill="#f7768e">ATTACKER.</tspan></text>
      <text x="0" y="148" fill="#a9b1d6">DEFEND IT LIKE A <tspan fill="#7aa2f7">GUARDIAN.</tspan></text>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- REALISTIC PIXEL FIRE BLAZE (Right Side)       -->
  <!-- ============================================== -->
  <g transform="translate(760, 160)" class="fire-glow-wrap">

    <!-- Embers Rising Upward into the Air -->
    <rect x="-8" y="-35" width="6" height="6" fill="#ffe066" class="ember-p1"/>
    <rect x="12" y="-30" width="5" height="5" fill="#ff7700" class="ember-p2"/>
    <rect x="-2" y="-45" width="5" height="5" fill="#ff2200" class="ember-p3"/>
    <rect x="18" y="-20" width="4" height="4" fill="#ffdd00" class="ember-p4"/>
    <rect x="-18" y="-28" width="5" height="5" fill="#ff5500" class="ember-p2"/>
    <rect x="4" y="-55" width="5" height="5" fill="#ffffff" class="ember-p1"/>

    <!-- Base Charcoal & Wood Log Foundation -->
    <g fill="#421a08">
      <rect x="-38" y="32" width="76" height="10"/>
      <rect x="-32" y="42" width="64" height="6"/>
      <rect x="-22" y="28" width="44" height="4" fill="#2d1205"/>
      <rect x="-14" y="32" width="8" height="10" fill="#78350f"/>
      <rect x="8" y="32" width="8" height="10" fill="#78350f"/>
    </g>

    <!-- LEFT FLAME TONGUE (Leaping Upwards) -->
    <g class="fire-left-tongue">
      <!-- Deep Red/Crimson -->
      <g fill="#d91414">
        <rect x="-28" y="8" width="18" height="24"/>
        <rect x="-24" y="-8" width="14" height="20"/>
        <rect x="-20" y="-24" width="10" height="18"/>
        <rect x="-16" y="-34" width="6" height="12"/>
      </g>
      <!-- Orange Core -->
      <g fill="#ff6600">
        <rect x="-24" y="12" width="12" height="18"/>
        <rect x="-20" y="-2" width="10" height="16"/>
        <rect x="-16" y="-18" width="6" height="18"/>
      </g>
      <!-- Yellow Tip -->
      <g fill="#ffea00">
        <rect x="-20" y="16" width="6" height="12"/>
        <rect x="-16" y="2" width="6" height="12"/>
      </g>
    </g>

    <!-- RIGHT FLAME TONGUE (Leaping Upwards) -->
    <g class="fire-right-tongue">
      <!-- Deep Red/Crimson -->
      <g fill="#d91414">
        <rect x="10" y="10" width="18" height="22"/>
        <rect x="10" y="-6" width="14" height="20"/>
        <rect x="10" y="-22" width="10" height="18"/>
        <rect x="10" y="-32" width="6" height="12"/>
      </g>
      <!-- Orange Core -->
      <g fill="#ff6600">
        <rect x="12" y="14" width="12" height="16"/>
        <rect x="10" y="0" width="10" height="16"/>
        <rect x="10" y="-16" width="6" height="18"/>
      </g>
      <!-- Yellow Tip -->
      <g fill="#ffea00">
        <rect x="14" y="16" width="6" height="12"/>
        <rect x="10" y="4" width="6" height="12"/>
      </g>
    </g>

    <!-- MAIN CENTER ROARING BLAZE (Vertical Heat Stretch) -->
    <g class="fire-blaze-main">
      <!-- Outer Flame (Red) -->
      <g fill="#e61a1a">
        <rect x="-20" y="16" width="40" height="16"/>
        <rect x="-16" y="2" width="32" height="18"/>
        <rect x="-12" y="-14" width="24" height="20"/>
        <rect x="-8" y="-32" width="16" height="22"/>
        <rect x="-4" y="-48" width="8" height="18"/>
        <rect x="-2" y="-56" width="4" height="10"/>
      </g>

      <!-- Mid Flame (Vibrant Orange) -->
      <g fill="#ff7300">
        <rect x="-16" y="18" width="32" height="14"/>
        <rect x="-12" y="6" width="24" height="16"/>
        <rect x="-8" y="-10" width="16" height="20"/>
        <rect x="-6" y="-26" width="12" height="18"/>
        <rect x="-2" y="-40" width="4" height="16"/>
      </g>

      <!-- Inner High-Heat Core (Yellow) -->
      <g fill="#ffea00">
        <rect x="-10" y="20" width="20" height="12"/>
        <rect x="-8" y="10" width="16" height="14"/>
        <rect x="-4" y="-4" width="8" height="16"/>
        <rect x="-2" y="-18" width="4" height="16"/>
      </g>

      <!-- White-Hot Core (White Sparks) -->
      <g fill="#ffffff" class="fire-core-white">
        <rect x="-4" y="20" width="8" height="10"/>
        <rect x="-2" y="12" width="4" height="10"/>
        <rect x="-2" y="0" width="4" height="8"/>
      </g>
    </g>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="24" y1="278" x2="876" y2="278" stroke="#2a2e45" stroke-width="2"/>
  <rect x="24" y="278" width="120" height="2" fill="#ff5500"/>

  <!-- Footer Info -->
  <g class="mono-font" font-size="12">
    <text x="24" y="298" fill="#7aa2f7" font-weight="700">BAGASKARA AMUKTI PALAPA</text>
    <text x="220" y="298" fill="#565f89">|</text>
    <text x="235" y="298" fill="#a9b1d6">Informatics Engineering @ Universitas Bina Darma</text>
    <text x="876" y="298" text-anchor="end" class="pixel-font" font-size="9" fill="#ff9e3b">STREAK &amp; FOCUS &#x1F525;</text>
  </g>

</svg>
