<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Core Philosophy - Bagaskara Amukti Palapa">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1B27"/>
      <stop offset="55%" stop-color="#1F2335"/>
      <stop offset="100%" stop-color="#24283B"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BB9AF7"/>
      <stop offset="50%" stop-color="#7AA2F7"/>
      <stop offset="100%" stop-color="#9ECE6A"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#BB9AF7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#BB9AF7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7AA2F7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7AA2F7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 H0 V26" fill="none" stroke="#2B3048" stroke-width="1"/>
    </pattern>

    <clipPath id="card">
      <rect x="0" y="0" width="900" height="330" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="900" height="330" fill="url(#bg)"/>
    <rect x="0" y="0" width="900" height="330" fill="url(#grid)" opacity="0.4"/>
    <circle cx="820" cy="30" r="240" fill="url(#glowA)"/>
    <circle cx="90" cy="320" r="230" fill="url(#glowB)"/>
    <rect x="0" y="0" width="6" height="330" fill="url(#accent)"/>
  </g>

  <rect x="0.75" y="0.75" width="898.5" height="328.5" rx="17.25" fill="none" stroke="#333B54" stroke-width="1.5"/>

  <circle cx="812" cy="44" r="5" fill="#F7768E" opacity="0.85"/>
  <circle cx="832" cy="44" r="5" fill="#E0AF68" opacity="0.85"/>
  <circle cx="852" cy="44" r="5" fill="#9ECE6A" opacity="0.85"/>

  <text x="46" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="150" fill="#7AA2F7" opacity="0.13">&#8220;</text>

  <rect x="47" y="38" width="8" height="14" rx="1.5" fill="#7AA2F7">
    <animate attributeName="opacity" values="1;0.08;1" dur="1.6s" repeatCount="indefinite"/>
  </rect>

  <text x="70" y="50" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace"
        font-size="12.5" letter-spacing="5" fill="#7AA2F7" opacity="0.85">CORE PHILOSOPHY</text>

  <g font-family="'Segoe UI', Roboto, Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="600" fill="#C0CAF5">
    <text x="70" y="112">Build it like an <tspan fill="#9ECE6A">engineer.</tspan></text>
    <text x="70" y="156">Think like an <tspan fill="#F7768E">attacker.</tspan></text>
    <text x="70" y="200">Defend it like a <tspan fill="#7AA2F7">Blue Team.</tspan></text>
  </g>

  <text x="70" y="238" font-family="'Segoe UI', Roboto, Ubuntu, 'Helvetica Neue', Arial, sans-serif"
        font-size="15" fill="#828BB0">Learning never stops &#8212; every system still has something left to teach.</text>

  <line x1="70" y1="266" x2="830" y2="266" stroke="#333B54" stroke-width="1.5"/>

  <text x="70" y="296" font-family="'Segoe UI', Roboto, Ubuntu, 'Helvetica Neue', Arial, sans-serif"
        font-size="14.5" font-weight="600" fill="#7AA2F7">Bagaskara Amukti Palapa</text>

  <text x="830" y="296" text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace"
        font-size="12.5" fill="#565F89">AI &amp; ML &#183; Blue Team &#183; Full-Stack Web</text>

</svg>
