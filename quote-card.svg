<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 195" width="100%" height="195">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Glowing Border Gradient (Cyan to Electric Violet to Pink) -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Text Glow Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Subtle Radial Glow on Top-Left -->
    <radialGradient id="topGlow" cx="20%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonBorder" x="-5%" y="-15%" width="110%" height="130%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f2fe" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#a855f7" flood-opacity="0.25" />
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#06b6d4" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Card Background with Neon Glow Border -->
  <rect x="8" y="8" width="924" height="179" rx="16" fill="url(#cardBg)" stroke="url(#borderGlow)" stroke-width="1.8" filter="url(#neonBorder)" />
  
  <!-- Subtle Internal Radial Glow -->
  <rect x="9" y="9" width="922" height="177" rx="15" fill="url(#topGlow)" />

  <!-- Cyber Bracket Accents -->
  <path d="M 24 38 L 24 24 L 38 24" stroke="#00f2fe" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 916 157 L 916 171 L 902 171" stroke="#ec4899" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Top Badge: CORE PHILOSOPHY -->
  <rect x="44" y="24" width="224" height="24" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" filter="url(#badgeGlow)" />
  <circle cx="56" cy="36" r="3.5" fill="#00f2fe" />
  <text x="68" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#c7d2fe" letter-spacing="1.2">CORE PHILOSOPHY // DEV &amp; SEC</text>

  <!-- Big Stylized Quote Marks -->
  <text x="42" y="98" font-family="'Georgia', serif" font-size="54" font-weight="bold" fill="#00f2fe" opacity="0.35">&#8220;</text>

  <!-- Main Quote (English) -->
  <text x="76" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="url(#textGrad)" letter-spacing="0.2">
    In a world full of noise, stay secure in your principles and sharp in your focus.
  </text>

  <!-- Subtitle Quote (Indonesian Translation) -->
  <text x="76" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" font-style="italic" fill="#94a3b8">
    Di dunia yang penuh dengan kebisingan, tetaplah kokoh dalam memegang prinsip dan tajam dalam menentukan fokus.
  </text>

  <!-- Divider Line -->
  <line x1="44" y1="144" x2="896" y2="144" stroke="#334155" stroke-width="0.8" opacity="0.6" />

  <!-- Bottom Metadata Row -->
  <circle cx="48" cy="162" r="3.5" fill="#10b981" />
  <text x="58" y="166" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="1.5">RESILIENCE &bull; FOCUS &bull; INTEGRITY</text>
  <text x="896" y="166" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="1">BAGASKARA AMUKTI PALAPA</text>
</svg>
