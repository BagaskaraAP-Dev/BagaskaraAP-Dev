name: Streak card

on:
  schedule:
    # 07:00, 13:00, 19:00, 01:00 WIB
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/streak-card.mjs
      - .github/workflows/streak-card.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: node scripts/streak-card.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if the card changed
        run: |
          git diff --quiet quote-card.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quote-card.svg
          git commit -m "Update streak card"
          git push
